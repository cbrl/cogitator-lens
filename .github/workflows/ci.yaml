name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check-types
      - run: npm run lint
      - name: Formatting
        run: npm run format:check
      - run: npm run test:unit
      - run: npm run compile
      - name: Extension host tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:extension
      - name: Extension host tests
        if: runner.os != 'Linux'
        run: npm run test:extension
      - run: npm audit --omit=dev

  package:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run package:vsix
      - name: Validate VSIX contents
        shell: bash
        run: |
          set -euo pipefail
          vsix="$(find . -maxdepth 1 -name '*.vsix' -print -quit)"
          test -n "$vsix"
          unzip -l "$vsix" > vsix-files.txt
          grep -q 'extension/dist/extension.js' vsix-files.txt
          grep -q 'extension/dist/webview/control-flow-graph.js' vsix-files.txt
          grep -q 'extension/dist/webview/control-flow-graph.css' vsix-files.txt
          grep -q 'extension/LICENSE.txt' vsix-files.txt
          grep -q 'extension/THIRD_PARTY_NOTICES.md' vsix-files.txt
          grep -q 'extension/resources/gear-phi.png' vsix-files.txt
          grep -q 'extension/syntaxes/python-bytecode.tmLanguage.json' vsix-files.txt
          grep -q 'extension/syntaxes/coglens-ast.tmLanguage.json' vsix-files.txt
          grep -q 'extension/syntaxes/coglens-mir.tmLanguage.json' vsix-files.txt
          ! grep -q 'extension/src/' vsix-files.txt
          ! grep -q 'extension/webview-src/' vsix-files.txt
          ! grep -q 'extension/test/' vsix-files.txt
          ! grep -q '\.map$' vsix-files.txt
          ! grep -q 'extension/assets/demo.gif' vsix-files.txt
      - uses: actions/upload-artifact@v4
        with:
          name: coglens-vsix
          path: '*.vsix'
